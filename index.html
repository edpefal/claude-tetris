<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div class="game-stats">
          <span>Combo: <strong id="gameover-combo">0</strong></span>
          <span>Líneas: <strong id="gameover-lines">0</strong></span>
        </div>

        <div id="name-entry" class="name-entry hidden">
          <p class="records-highlight-msg">¡Nuevo récord! Ingresa tu nombre:</p>
          <input type="text" id="name-input" maxlength="12" placeholder="ANON" />
          <button id="name-submit-btn">Guardar</button>
        </div>

        <table class="records-table">
          <thead>
            <tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th><th>Nivel</th></tr>
          </thead>
          <tbody id="gameover-top-body"></tbody>
        </table>

        <div class="records-bests">
          <span>Mejor combo: <strong id="gameover-best-combo">0</strong></span>
          <span>Máx. líneas: <strong id="gameover-max-lines">0</strong></span>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p class="start-title">TETRIS</p>

        <table class="records-table">
          <thead>
            <tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th><th>Nivel</th></tr>
          </thead>
          <tbody id="start-top-body"></tbody>
        </table>

        <div class="records-bests">
          <span>Mejor combo: <strong id="start-best-combo">0</strong></span>
          <span>Máx. líneas: <strong id="start-max-lines">0</strong></span>
        </div>

        <button id="play-btn">JUGAR</button>
        <button id="reset-scores-btn">Resetear records</button>
      </div>
    </div>
  </div>

  <script src="scores.js"></script>
  <script src="game.js"></script>
</body>
</html>
